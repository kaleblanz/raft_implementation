syntax = "proto3";

option go_package = "cse586.raftm/api";

package api;

// Log Entry represents a single log entry; it consists of a key and a
// value.  When this log entry is committed, the associated key will
// be set to this value until it is superseded by a later log entry.
message LogEntry {
    // Key is a UTF-8 (regular Go) string specifying the variable
    // set by this log entry.  For the artificial commits propagated
    // by a new leader, it is "" and no state change takes place.
    string key = 1;
    // Value is the value that will be associated with this variable
    // when this log entry commits.
    bytes value = 2;
    // Term is the term in which this log entry was introduced.
    int32 term = 3;
}

// MessageType indicates which type of RPC is being performed.
enum MessageType {
    // APPEND is the heartbeat message type.  Equivalent to
    // AppendEntries as sent by the leader in the Raft paper.
    APPEND = 0;
    // APPEND_REPLY indicates how the server handled the APPEND.
    // Equivalent to AppendEntries as returned by a follower in the
    // Raft paper.
    APPEND_REPLY = 1;
    // VOTE_REQUEST is sent by candidates during election.  Equivalent
    // to RequestVote as sent by a candidate in the Raft paper.
    VOTE_REQUEST = 2;
    // VOTE_REPLY can allow or deny a vote request.  Equivalent to
    // RequestVote as sent in reply to a candidate in the Raft paper.
    VOTE_REPLY = 3;
    // SET_VALUE is a request from a client to set a value for a key.
    SET_VALUE = 4;
    // GET_VALUE is a request from a client to retrieve the
    // currently-committed value for a key.
    GET_VALUE = 5;
    // ACK is the response to SET_VALUE or GET_VALUE if the recipient
    // is the leader.
    ACK = 6;
    // REDIRECT is the response to SET_VALUE or GET_VALUE if the
    // recipient is NOT the leader.
    REDIRECT = 7;
}

// The one and only message type used by this service.  It is used
// both for client requests and for cluster communication between the
// leader and other servers.  Note that this message format allows no
// more than 2^31 - 1 servers, terms, or log entries.
message RafTMMessage {
    // Type determines the meaning of the rest of the message fields.
    //
    // Meaningful for: all messages
    MessageType type = 1;

    // The following fields are for server-to-server messages

    // Sender is the server number of the server sending this message.
    // It serves the role of leaderId in the Raft paper for APPEND
    // messages sent by the current leader.  It is not meaningful for
    // client requests.
    //
    // Meaningful for: APPEND, APPEND_REPLY, VOTE_REQUEST, VOTE_REPLY
    int32 sender = 2;
    // Term is the term of server-to-server messages.  It is used for
    // both the argument and result term fields of both AppendEntries
    // and RequestVote in the Raft paper.  It is also not meaningful
    // for client requests.
    //
    // Meaningful for: APPEND, APPEND_REPLY, VOTE_REQUEST, VOTE_REPLY
    int32 term = 3;
    // Committed is the index of the final message known to be
    // committed by this server.  This serves the place of
    // leaderCommit in APPEND messages, but should be set on all
    // messages sent by servers.
    //
    // Meaningful for: APPEND, VOTE_REQUEST
    int32 committed = 4;
    // PrevIndex is the log index of the log entry immediately
    // preceding any log entries in this message.  This is equivalent
    // to prevLogIndex AND lastLogIndex in the Raft paper, but is also
    // set on replies to make APPEND (optionally) more efficient.
    //
    // Meaningful for: APPEND, APPEND_REPLY, VOTE_REQUEST
    int32 prevIndex = 5;
    // PrevTerm is the term of the entry at PrevIndex in the sender's
    // log.  This is equivalent to prevLogTerm and lastLogTerm in the
    // Raft paper, but is also set on replies to make APPEND
    // (optionally) more efficient.
    //
    // Meaningful for: APPEND, APPEND_REPLY, VOTE_REQUEST
    int32 prevTerm = 6;

    // The following two fields are used for both server-to-server and
    // client-server exchanges.
    
    // Success indicates, for server replies, whether the requested
    // action (for APPEND_REPLY) was successful or the requested vote (for
    // VOTE_REPLY) is positive.
    //
    // For SET_VALUE it indicates whether the value was successfully
    // stored.  A value of false means that the request was malformed,
    // true means that the entry is committed.
    //
    // For GET_VALUE, a value of true indicates that the state
    // variable was present in the log, and false that it was not
    // found.
    //
    // Meaningful for: APPEND_REPLY, VOTE_REPLY, SET_VALUE, GET_VALUE
    bool success = 7;
    // Entries serves many duties:
    // 
    // It is the sequence of entries, in order starting with the first
    // entry following PrevIndex, attached to an APPEND message.
    //
    // The Key field is the item to be looked up on a GET_VALUE
    // request, and the Value field is ignored for this usage.
    //
    // It holds the singular result of a successful GET_VALUE client
    // request.
    //
    // It contains the state variable to be set in Key, and the value
    // to set it to in Value, for a SET_VALUE client request.
    //
    // The Key field is the state variable that was set in the ACK
    // acknowledging a SET_VALUE client request, and the Value field
    // is ignored for this usage.
    //
    // Meaningful for: APPEND, GET_VALUE, SET_VALUE, ACK
    repeated LogEntry entries = 8;


    // The following fields are for client-server exchanges only:

    // Sequence number to be set by the client and copied in the
    // server reply; see the handout for more information.  This is
    // necessary in some cases because of UDP semantics.
    //
    // Meaningful for: GET_VALUE, SET_VALUE, ACK, REDIRECT
    int32 sequence = 9;

    // Leader contains a socket address for the current leader in a
    // REDIRECT request sent by a follower in response to a client
    // SET_VALUE or GET_VALUE.  It should be generated by calling
    // String() on the current leader's net.UDPAddr.
    //
    // Meaningful for: REDIRECT
    string leader = 10;
}
